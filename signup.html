<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - meal.app</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Link -->
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

    <!-- Khối Wrapper nằm chính giữa màn hình -->
    <div class="register-wrapper">
        
        <!-- Header thông tin Thương hiệu meal.app -->
        <div class="brand-header">
            <div class="brand-logo">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1>meal.app</h1>
            <p>Discover thousands of delicious recipes every day</p>
        </div>

        <!-- Card Đăng ký chính -->
        <div class="register-card">
            <h2>Create an Account</h2>
            
            <form id="registerForm">
                <!-- Họ tên -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="John Doe" required>
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <!-- Mật khẩu -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="At least 6 characters" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <!-- Điều khoản sử dụng -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" style="display:inline; font-weight:normal;">
                        I agree to the <a href="#">Terms of Service</a>
                    </label>
                </div>

                <!-- Nút Submit -->
                <button type="submit" class="btn-submit">Register Now</button>
            </form>

            <!-- Footer chuyển đổi Login -->
            <div class="auth-footer">
                Already have an account? <a href="signin.html">Sign in</a>
            </div>
        </div>

        <!-- Thông tin API Badge bên dưới card -->
        <div class="api-badge">
            <i class="fa-solid fa-database"></i> 
            Powered by <strong>TheMealDB API</strong>
        </div>

    </div>

    <!-- Custom Popup Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon success">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Account registered successfully!</p>
            <button id="modalCloseBtn" class="modal-btn">OK</button>
        </div>
    </div>

    <!-- Kết nối file JavaScript ngoài -->
    <script src="js/signup.js"></script>
</body>
</html>
