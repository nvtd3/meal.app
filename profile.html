<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - meal.app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="nav-brand">
            <div class="nav-logo-icon"><i class="fa-solid fa-utensils"></i></div>
            meal<span>.app</span>
        </a>
        <a href="home.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </nav>

    <!-- Profile Container -->
    <main class="profile-container">
        <div class="profile-header-card">
            <div class="profile-big-avatar" id="profileBigAvatar">U</div>
            <h1 id="profileFullName">Loading...</h1>
            <p id="profileEmail">loading@email.com</p>
            <span class="role-badge"><i class="fa-solid fa-shield-halved"></i> Verified Member</span>
        </div>

        <div class="profile-grid">
            <!-- Thẻ thống kê tài khoản -->
            <div class="profile-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Activity Stats</h3>
                <div class="stat-row">
                    <span>Saved Favorite Recipes</span>
                    <strong id="favCount">0</strong>
                </div>
                <div class="stat-row">
                    <span>Account Status</span>
                    <strong style="color: #2A9D8F;">Active</strong>
                </div>
                <div class="stat-row">
                    <span>Member Since</span>
                    <strong id="memberSince">2026</strong>
                </div>
            </div>

            <!-- Form cập nhật thông tin cá nhân -->
            <div class="profile-card">
                <h3><i class="fa-regular fa-user"></i> Edit Profile Information</h3>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="editFullname">Full Name</label>
                        <input type="text" id="editFullname" required>
                    </div>
                    <div class="form-group">
                        <label for="editEmail">Email Address (Read-only)</label>
                        <input type="email" id="editEmail" disabled style="background: #E2E8F0; cursor: not-allowed;">
                    </div>
                    <button type="submit" class="btn-submit">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal Thông báo -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon success"><i class="fa-solid fa-check"></i></div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Profile updated successfully.</p>
            <button id="modalCloseBtn" class="modal-btn">OK</button>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
